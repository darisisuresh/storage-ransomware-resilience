name: evidence-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test
        run: python3 -m unittest discover -s tests -v
      - name: Verify privacy boundary and Git history
        run: python3 scripts/privacy_check.py --history
      - name: Reproduce aggregate evidence
        run: |
          python3 scripts/run_experiments.py
          git diff --exit-code -- evidence/results
